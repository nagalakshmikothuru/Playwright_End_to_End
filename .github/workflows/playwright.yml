name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testFile:
        description: 'Test file to run (e.g. tests/example.spec.ts)'
        required: false
        default: ''
      grep:
        description: 'Test title pattern (e.g. "should login")'
        required: false
        default: ''

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          $args = @("playwright", "test")
          if ($env:TEST_FILE) {
            $args += $env:TEST_FILE
          }
          if ($env:TEST_TITLE) {
            $args += "-g"
            $args += $env:TEST_TITLE
          }
          Write-Host "Running: npx $($args -join ' ')"
          npx @args
        env:
          TEST_FILE: ${{ github.event.inputs.testFile }}
          TEST_TITLE: ${{ github.event.inputs.grep }}

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7